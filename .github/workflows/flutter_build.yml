name: English Master Otomatik Derleme

on:
  push:
    # "birlestirme" dalinda APK yalnizca derlenir ve indirilebilir (Artifact) olur;
    # testerlara dagitim sadece "main" dalinda yapilir (asagidaki son adim).
    branches: [ "main", "birlestirme" ]
  # GitHub > Actions sayfasindan elle de calistirilabilir.
  workflow_dispatch:

jobs:
  apk_olustur:
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu Buluttan Cek
        uses: actions/checkout@v3

      - name: Java (Android) Altyapisini Kur
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          # Surum sabit: '3.x' her seferinde en yeni Flutter'i kuruyordu. Bu surumle APK'nin
          # derlendigi yerelde dogrulandi. Yukseltmeden once `flutter build apk` ile deneyin.
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Paketleri ve Eklentileri Indir
        run: flutter pub get

      - name: Kod Analizi ve Testler
        # Hata varsa APK derlenmez ve testerlara bozuk surum gitmez.
        run: |
          flutter analyze
          flutter test

      - name: Android APK Derle
        # Anahtarlar kodda degil, GitHub > Settings > Secrets icinde durur.
        # PIXABAY_API_KEY istege baglidir; yoksa kelime kartlari resimsiz gosterilir.
        run: flutter build apk --release "--dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" "--dart-define=PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}"

      - name: APK Dosyasini Cantaya Koy (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: english-master-apk
          path: build/app/outputs/flutter-apk/app-release.apk
 
      - name: Firebase App Distribution'a Yukle
        # Deneme dallarindan testerlara surum gitmez.
        if: github.ref == 'refs/heads/main'
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups testerlar
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
